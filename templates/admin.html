<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Server Admin</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 24px;
            background: #f0f2f5;
            color: #333;
            font: 14px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .container { max-width: 960px; margin: 0 auto; }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
        }
        header h1 { font-size: 1.3rem; color: #2c3e50; margin: 0; }
        header .info { font-size: 0.85rem; color: #95a5a6; }

        .row { display: flex; gap: 16px; margin-bottom: 16px; flex-wrap: wrap; }

        .card {
            flex: 1 1 210px;
            background: #fff;
            border-radius: 8px;
            padding: 18px 20px;
            border-left: 4px solid #3498db;
            cursor: pointer;
            transition: box-shadow .15s;
            box-shadow: 0 1px 3px rgba(0,0,0,.08);
        }
        .card:hover { box-shadow: 0 4px 12px rgba(0,0,0,.12); }
        .card.authors { border-left-color: #2ecc71; }
        .card.requests { border-left-color: #e67e22; }
        .card.tabs     { border-left-color: #9b59b6; }

        .card h2 {
            margin: 0 0 6px;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: .5px;
            color: #7f8c8d;
        }
        .card .val {
            font-size: 2rem;
            font-weight: 700;
            color: #2c3e50;
        }

        .actions {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }
        .btn {
            background: #3498db;
            color: #fff;
            border: none;
            padding: 8px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: background .15s;
        }
        .btn:hover { background: #2980b9; }
        .fade { color: #b0b8c0; font-size: 0.8rem; }

        /* modal — unchanged */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-content {
            background: white;
            border-radius: 12px;
            max-width: 800px;
            width: 100%;
            max-height: 80vh;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            animation: modalFade 0.3s ease;
        }

        @keyframes modalFade {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal-header {
            padding: 20px 25px;
            border-bottom: 1px solid #eee;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .modal-header h3 {
            margin: 0;
            color: #2c3e50;
            font-size: 1.5rem;
            flex-shrink: 0;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 1.8rem;
            color: #95a5a6;
            cursor: pointer;
            line-height: 1;
            padding: 0;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }

        .modal-close:hover {
            background: #f5f5f5;
            color: #e74c3c;
        }

        .modal-body {
            padding: 25px;
            overflow-y: auto;
            height: calc(80vh - 80px);
            min-height: 200px;
        }

        .list-container {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 20px;
            height: 100%;
            overflow-y: auto;
        }

        .list-item {
            padding: 12px 15px;
            border-bottom: 1px solid #e9ecef;
            font-family: 'Courier New', monospace;
            font-size: 0.95rem;
            word-break: break-word;
        }

        .list-item:last-child {
            border-bottom: none;
        }

        .list-item:nth-child(even) {
            background: #f1f3f5;
        }

        .empty-list {
            text-align: center;
            color: #95a5a6;
            padding: 40px;
            font-style: italic;
        }

        /* Loading spinner */
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(52, 152, 219, 0.3);
            border-radius: 50%;
            border-top-color: #3498db;
            animation: spin 0.8s linear infinite;
            margin-right: 10px;
            vertical-align: middle;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .loading {
            color: #3498db;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* Icons using Unicode */
        .icon {
            font-size: 1.5em;
            margin-right: 8px;
        }

        /* Search box */
        .search-container {
            flex: 1;
            margin: 0 20px;
            max-width: 400px;
        }

        .search-box {
            width: 100%;
            padding: 10px 15px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 0.95rem;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
            background: #f8f9fa;
        }

        .search-box:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.2);
            background: white;
        }

        .search-box::placeholder {
            color: #95a5a6;
        }

        /* Search result counter */
        .search-result-info {
            font-size: 0.9rem;
            color: #7f8c8d;
            margin-top: 5px;
            text-align: right;
        }

        /* Highlight search matches */
        .highlight {
            background-color: #fff3cd;
            font-weight: bold;
            padding: 2px 4px;
            border-radius: 3px;
        }

        /* No results message */
        .no-results {
            text-align: center;
            color: #e74c3c;
            padding: 30px;
            font-style: italic;
        }

        /* Request stats table */
        .stats-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }

        .stats-table th,
        .stats-table td {
            padding: 8px 12px;
            text-align: right;
            border-bottom: 1px solid #eee;
        }

        .stats-table th {
            background: #f8f9fa;
            color: #555;
            font-weight: 600;
            position: sticky;
            top: 0;
        }

        .stats-table td:first-child,
        .stats-table th:first-child {
            text-align: left;
        }

        .stats-table tr:hover {
            background: #f0f7ff;
        }

        .stat-row-overall {
            font-weight: 700;
            background: #eef5ff;
        }
    </style>
</head>

<body>
<div class="container">

<header>
    <h1>📊 Dashboard</h1>
    <span class="info">updated <span id="updated">{current_time}</span> · auto 30s</span>
</header>

<div class="row">
    <div class="card" onclick="showTitlesModal()">
        <h2>📚 Titles</h2>
        <div class="val" id="titles-count">{cache_count}</div>
    </div>
    <div class="card authors" onclick="showAuthorsModal()">
        <h2>👤 Authors</h2>
        <div class="val" id="authors-count">{author_count}</div>
    </div>
    <div class="card requests" onclick="showRequestStatsModal()">
        <h2>⚡ Requests</h2>
        <div class="val" id="requests-count">0</div>
    </div>
    <div class="card tabs" onclick="showOpenTabsModal()">
        <h2>🌐 Open Tabs</h2>
        <div class="val" id="tabs-count">0</div>
    </div>
</div>

<div class="actions">
    <button class="btn" onclick="refreshCache()">🔄 Refresh Cache</button>
    <span class="fade" id="uptime"></span>
</div>

</div>

    <!-- Titles Modal -->
    <div class="modal" id="titles-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>📚 All Titles (<span id="modal-titles-count">0</span>)</h3>
                <div class="search-container">
                    <input type="text" class="search-box" id="titles-search" placeholder="Search titles..."
                        autocomplete="off">
                    <div class="search-result-info" id="titles-search-info"></div>
                </div>
                <button class="modal-close" onclick="closeModal('titles-modal')">&times;</button>
            </div>
            <div class="modal-body">
                <div id="titles-list-container" class="list-container">
                    <div class="loading">
                        <div class="spinner"></div> Loading titles...
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Request Stats Modal -->
    <div class="modal" id="requests-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>⚡ Request Latency Statistics</h3>
                <span id="requests-uptime-display" style="color:#7f8c8d;font-size:0.9rem;flex:1;margin-left:15px;"></span>
                <button class="modal-close" onclick="closeModal('requests-modal')">&times;</button>
            </div>
            <div class="modal-body">
                <div id="requests-stats-container" class="list-container">
                    <div class="loading">
                        <div class="spinner"></div> Loading stats...
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Open Tabs Modal -->
    <div class="modal" id="tabs-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>🌐 Open Tabs (<span id="modal-tabs-count">0</span>)</h3>
                <button class="modal-close" onclick="closeModal('tabs-modal')">&times;</button>
            </div>
            <div class="modal-body">
                <div id="tabs-list-container" class="list-container">
                    <div class="loading"><div class="spinner"></div> Loading...</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Authors Modal -->
    <div class="modal" id="authors-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>👤 All Authors (<span id="modal-authors-count">0</span>)</h3>
                <div class="search-container">
                    <input type="text" class="search-box" id="authors-search" placeholder="Search authors..."
                        autocomplete="off">
                    <div class="search-result-info" id="authors-search-info"></div>
                </div>
                <button class="modal-close" onclick="closeModal('authors-modal')">&times;</button>
            </div>
            <div class="modal-body">
                <div id="authors-list-container" class="list-container">
                    <div class="loading">
                        <div class="spinner"></div> Loading authors...
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Global variables
        let refreshInterval;
        const REFRESH_INTERVAL_MS = 30000; // 30 seconds

        // Search data storage
        let allTitles = [];
        let allAuthors = [];
        let currentTitlesFilter = '';
        let currentAuthorsFilter = '';

        // Initialize on load
        document.addEventListener('DOMContentLoaded', function () {
            // Initial fetch of stats
            fetchStats();
            // Set up auto-refresh
            refreshInterval = setInterval(fetchStats, REFRESH_INTERVAL_MS);

            // Setup search functionality
            const titlesSearch = document.getElementById('titles-search');
            const authorsSearch = document.getElementById('authors-search');

            if (titlesSearch) {
                titlesSearch.addEventListener('input', function (e) {
                    currentTitlesFilter = e.target.value;
                    renderTitlesList(currentTitlesFilter);
                });
            }

            if (authorsSearch) {
                authorsSearch.addEventListener('input', function (e) {
                    currentAuthorsFilter = e.target.value;
                    renderAuthorsList(currentAuthorsFilter);
                });
            }
        });

        // Fetch stats from server
        async function fetchStats() {
            try {
                const response = await fetch('/api/stats');
                if (!response.ok) throw new Error('Failed to fetch stats');
                const data = await response.json();

                document.getElementById('titles-count').textContent = data.cache_count;
                document.getElementById('authors-count').textContent = data.author_count;
                document.getElementById('updated').textContent = data.current_time;

                if (data.request_stats) {
                    document.getElementById('requests-count').textContent = data.request_stats.total_requests;
                    document.getElementById('uptime').textContent =
                        `up ${formatUptime(data.request_stats.uptime_seconds)}`;
                }

                // Update open tabs count
                fetchTabsCount();

                // Update modal counts if modals are open
                const titlesModal = document.getElementById('titles-modal');
                const authorsModal = document.getElementById('authors-modal');
                const requestsModal = document.getElementById('requests-modal');

                if (titlesModal.style.display === 'flex') {
                    fetchTitlesList();
                }
                if (authorsModal.style.display === 'flex') {
                    fetchAuthorsList();
                }
                if (requestsModal.style.display === 'flex') {
                    showRequestStatsModal();
                }
                const tabsModal = document.getElementById('tabs-modal');
                if (tabsModal.style.display === 'flex') {
                    fetchOpenTabsList();
                }
            } catch (error) {
                console.error('Error fetching stats:', error);
                // Optionally show error message
            }
        }

        // Fetch titles list for modal
        async function fetchTitlesList() {
            const container = document.getElementById('titles-list-container');
            container.innerHTML = '<div class="loading"><div class="spinner"></div> Loading titles...</div>';

            try {
                const response = await fetch('/api/titles');
                if (!response.ok) throw new Error('Failed to fetch titles');
                const data = await response.json();

                // Store titles for search
                allTitles = data.titles || [];

                // Update modal count
                document.getElementById('modal-titles-count').textContent = allTitles.length;

                // Render list with current filter
                renderTitlesList(currentTitlesFilter);
            } catch (error) {
                console.error('Error fetching titles:', error);
                container.innerHTML = '<div class="empty-list" style="color:#e74c3c">Error loading titles</div>';
            }
        }

        // Render titles list with optional filter
        function renderTitlesList(filter = '') {
            const container = document.getElementById('titles-list-container');

            if (!allTitles || allTitles.length === 0) {
                container.innerHTML = '<div class="empty-list">No titles found in cache</div>';
                return;
            }

            const filterLower = filter.toLowerCase();
            const filteredTitles = filter ? allTitles.filter(title =>
                title.toLowerCase().includes(filterLower)
            ) : allTitles;

            // Render list
            if (filteredTitles.length > 0) {
                let html = '';
                filteredTitles.forEach(title => {
                    const escapedTitle = escapeHtml(title);
                    const highlightedTitle = filter ?
                        escapedTitle.replace(
                            new RegExp(`(${escapeRegExp(filter)})`, 'gi'),
                            '<span class="highlight">$1</span>'
                        ) : escapedTitle;
                    html += `<div class="list-item">${highlightedTitle}</div>`;
                });
                container.innerHTML = html;
            } else {
                container.innerHTML = `<div class="no-results">No titles found matching "${escapeHtml(filter)}"</div>`;
            }
        }

        // Fetch authors list for modal
        async function fetchAuthorsList() {
            const container = document.getElementById('authors-list-container');
            container.innerHTML = '<div class="loading"><div class="spinner"></div> Loading authors...</div>';

            try {
                const response = await fetch('/api/authors');
                if (!response.ok) throw new Error('Failed to fetch authors');
                const data = await response.json();

                // Store authors for search
                allAuthors = data.authors || [];

                // Update modal count
                document.getElementById('modal-authors-count').textContent = allAuthors.length;

                // Render list with current filter
                renderAuthorsList(currentAuthorsFilter);
            } catch (error) {
                console.error('Error fetching authors:', error);
                container.innerHTML = '<div class="empty-list" style="color:#e74c3c">Error loading authors</div>';
            }
        }

        // Render authors list with optional filter
        function renderAuthorsList(filter = '') {
            const container = document.getElementById('authors-list-container');
            if (!allAuthors || allAuthors.length === 0) {
                container.innerHTML = '<div class="empty-list">No authors found in cache</div>';
                return;
            }

            const filterLower = filter.toLowerCase();
            const filteredAuthors = filter ? allAuthors.filter(author =>
                author.toLowerCase().includes(filterLower)
            ) : allAuthors;


            // Render list
            if (filteredAuthors.length > 0) {
                let html = '';
                filteredAuthors.forEach(author => {
                    const escapedAuthor = escapeHtml(author);
                    const highlightedAuthor = filter ?
                        escapedAuthor.replace(
                            new RegExp(`(${escapeRegExp(filter)})`, 'gi'),
                            '<span class="highlight">$1</span>'
                        ) : escapedAuthor;
                    html += `<div class="list-item">${highlightedAuthor}</div>`;
                });
                container.innerHTML = html;
            } else {
                container.innerHTML = `<div class="no-results">No authors found matching "${escapeHtml(filter)}"</div>`;
            }
        }

        // Show titles modal
        function showTitlesModal() {
            const modal = document.getElementById('titles-modal');
            modal.style.display = 'flex';
            // Reset search
            currentTitlesFilter = '';
            const searchInput = document.getElementById('titles-search');
            if (searchInput) {
                searchInput.value = '';
                // Focus search input after a short delay
                setTimeout(() => searchInput.focus(), 100);
            }
            fetchTitlesList();
        }

        // Show authors modal
        function showAuthorsModal() {
            const modal = document.getElementById('authors-modal');
            modal.style.display = 'flex';
            // Reset search
            currentAuthorsFilter = '';
            const searchInput = document.getElementById('authors-search');
            if (searchInput) {
                searchInput.value = '';
                // Focus search input after a short delay
                setTimeout(() => searchInput.focus(), 100);
            }
            fetchAuthorsList();
        }

        // Close modal
        function closeModal(modalId) {
            document.getElementById(modalId).style.display = 'none';
        }

        // Close modal when clicking outside content
        window.onclick = function (event) {
            const titlesModal = document.getElementById('titles-modal');
            const authorsModal = document.getElementById('authors-modal');
            const requestsModal = document.getElementById('requests-modal');

            if (event.target === titlesModal) {
                closeModal('titles-modal');
            }
            if (event.target === authorsModal) {
                closeModal('authors-modal');
            }
            if (event.target === requestsModal) {
                closeModal('requests-modal');
            }
            const tabsModal = document.getElementById('tabs-modal');
            if (event.target === tabsModal) {
                closeModal('tabs-modal');
            }
        }

        async function refreshCache() {
            const btn = document.querySelector('.btn');
            btn.textContent = '⏳ Refreshing...';
            try {
                const rsp = await fetch('/refresh-cache', { method: 'POST' });
                const data = await rsp.json();
                btn.textContent = data.success ? '✅ Done' : '❌ Failed';
                fetchStats();
            } catch {
                btn.textContent = '❌ Failed';
            }
            setTimeout(() => { btn.textContent = '🔄 Refresh Cache'; }, 2000);
        }

        // Format uptime from seconds
        function formatUptime(seconds) {
            const d = Math.floor(seconds / 86400);
            const h = Math.floor((seconds % 86400) / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            const s = Math.floor(seconds % 60);
            const parts = [];
            if (d > 0) parts.push(`${d}d`);
            if (h > 0) parts.push(`${h}h`);
            if (m > 0) parts.push(`${m}m`);
            parts.push(`${s}s`);
            return parts.join(' ');
        }

        // Show request latency statistics modal
        async function showRequestStatsModal() {
            const modal = document.getElementById('requests-modal');
            modal.style.display = 'flex';
            const container = document.getElementById('requests-stats-container');
            container.innerHTML = '<div class="loading"><div class="spinner"></div> Loading stats...</div>';

            try {
                const response = await fetch('/api/stats');
                const data = await response.json();
                const rs = data.request_stats;

                if (!rs) {
                    container.innerHTML = '<div class="empty-list">No request data available yet</div>';
                    return;
                }

                document.getElementById('requests-uptime-display').textContent =
                    `Uptime: ${formatUptime(rs.uptime_seconds)} | Total: ${rs.total_requests} requests`;

                let html = '<table class="stats-table"><thead><tr>' +
                    '<th>Endpoint</th><th>Count</th><th>Min</th><th>Avg</th><th>Max</th>' +
                    '<th>P50</th><th>P90</th><th>P99</th></tr></thead><tbody>';

                // Overall row
                const o = rs.overall;
                if (o.count > 0) {
                    html += `<tr class="stat-row-overall"><td>📊 TOTAL (all endpoints)</td>
                        <td>${o.count}</td><td>${o.min}ms</td><td>${o.avg}ms</td>
                        <td>${o.max}ms</td><td>${o.p50}ms</td><td>${o.p90}ms</td>
                        <td>${o.p99}ms</td></tr>`;
                }

                // Per-endpoint rows
                const endpoints = rs.per_endpoint || {};
                for (const [endpoint, s] of Object.entries(endpoints)) {
                    html += `<tr><td>${escapeHtml(endpoint)}</td>
                        <td>${s.count}</td><td>${s.min}ms</td><td>${s.avg}ms</td>
                        <td>${s.max}ms</td><td>${s.p50}ms</td><td>${s.p90}ms</td>
                        <td>${s.p99}ms</td></tr>`;
                }

                html += '</tbody></table>';

                if (o.count === 0 && Object.keys(endpoints).length === 0) {
                    html = '<div class="empty-list">No requests processed yet</div>';
                }

                container.innerHTML = html;

            } catch (error) {
                console.error('Error fetching request stats:', error);
                container.innerHTML = '<div class="empty-list" style="color:#e74c3c">Error loading stats</div>';
            }
        }

        // Helper: escape special regex characters
        function escapeRegExp(string) {
            return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }

        // Helper: escape HTML to prevent XSS
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Fetch open tabs count (lightweight, updates the stat card)
        async function fetchTabsCount() {
            try {
                const response = await fetch('/api/tabs');
                const data = await response.json();
                document.getElementById('tabs-count').textContent = data.tabs ? data.tabs.length : 0;
            } catch {
                // server may not have open tabs yet
            }
        }

        // Show open tabs modal
        function showOpenTabsModal() {
            document.getElementById('tabs-modal').style.display = 'flex';
            fetchOpenTabsList();
        }

        // Fetch and render open tabs list
        async function fetchOpenTabsList() {
            const container = document.getElementById('tabs-list-container');
            container.innerHTML = '<div class="loading"><div class="spinner"></div> Loading...</div>';

            try {
                const response = await fetch('/api/tabs');
                const data = await response.json();
                const tabs = data.tabs || [];

                document.getElementById('modal-tabs-count').textContent = tabs.length;

                if (tabs.length === 0) {
                    container.innerHTML = '<div class="empty-list">No open tabs tracked</div>';
                    return;
                }

                let html = '';
                for (const tab of tabs) {
                    const title = escapeHtml(tab.title || '(no title)');
                    const url = escapeHtml(tab.url || '');
                    html += `<div class="list-item">
                        <div style="font-weight:600;margin-bottom:2px">${title}</div>
                        <div style="font-size:0.8rem;color:#95a5a6">${url}</div>
                    </div>`;
                }
                container.innerHTML = html;
            } catch {
                container.innerHTML = '<div class="empty-list" style="color:#e74c3c">Error loading open tabs</div>';
            }
        }
    </script>
</body>

</html>
